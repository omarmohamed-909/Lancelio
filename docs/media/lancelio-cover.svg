  <circle cx="1233" cy="19" r="111" stroke="#DCE8C9" stroke-opacity=".09" />
  <circle cx="1233" cy="19" r="154" stroke="#DCE8C9" stroke-opacity=".06" />
  <g font-family="Arial, Helvetica, sans-serif">
