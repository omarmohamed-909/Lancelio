      <stop stop-color="#173F31" />
      <stop offset="1" stop-color="#0B241C" />
    </linearGradient>
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="translate(615 50) rotate(90) scale(500 560)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#47785A" stop-opacity=".36" />
      <stop offset="1" stop-color="#47785A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#forest)" />
  <rect width="1280" height="400" rx="28" fill="url(#glow)" />
  <path
    d="M726 0V400M758 0V400M790 0V400"
