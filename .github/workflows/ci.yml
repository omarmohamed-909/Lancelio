name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:api-startup
      - run: npm audit --omit=dev
      - run: node tools/release/install-database-tools.mjs
      - run: npm run test:backup
        env:
          MONGODB_TOOLS_DIRECTORY: ${{ github.workspace }}/.cache/database-tools/mongodb-database-tools-ubuntu2404-x86_64-100.19.1/bin
      - run: npm exec --workspace @lancelio/web -- playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:pwa
      - run: npm run test:release
